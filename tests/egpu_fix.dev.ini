; Developer / measurement settings: every key the DLL reads, with its code default unless noted.
; The release ini (package\egpu_fix.ini) only has the keys users should touch.
; For the smoke test copy this file to build\egpu_fix.ini.

[General]
; 1 = install the D3D12/DXGI hooks. 0 = the DLL only forwards version.dll calls.
Hooks=1
; 0 = fix-only mode (default): only the creation hooks the fix needs + FPS / CPU-per-thread stats.
; 1 = full measurement: binding/draw/submit hooks, buffer stats, GPU timing, KMT stats.
Measure=0
; 1 = load WinPixGpuCapturer.dll at startup so PIX can attach (GPU / timing captures).
LoadPix=0
; Capturer path; empty = newest %ProgramFiles%\Microsoft PIX\<version>\WinPixGpuCapturer.dll.
PixDll=

[Stats]
; Seconds between stats blocks in egpu_proxy.log (default 5).
IntervalSec=1
; Measure=1: how many small (<1 MB) sysmem buffer creations to log individually (>=1 MB are always logged).
LogCreateLimit=300
; Measure=1: how many sysmem buffers to list per stats block.
TopN=8
; Measure=1: GPU timestamps around every game command list (GPU busy/idle, time per list kind). Default 1.
GpuTiming=1
; Measure=1: count and time D3DKMT kernel calls (allocations, VA mapping, submissions). Default 0.
KmtStats=1

[Fix]
; Stage 2c (NVAPI, no ReBAR needed): create the game's UPLOAD heaps in CPU-visible VRAM (256 MB BAR1
; window), so the GPU reads its per-frame VB/SRV buffers from VRAM. CPU writes become slower (~0.8 GB/s).
; Only runs on an NVIDIA GPU without ReBAR.
VidmemHeaps=1
; Also run stage 2c when the GPU has ReBAR (GPUUploadHeapSupported=1). Untested.
VidmemWithReBAR=0
; Same for committed UPLOAD buffers (constant pages etc.) up to VidmemBufMaxKB. No evidence it helps.
VidmemBuffers=0
VidmemBufMaxKB=4096
; Max of our live CPU-visible VRAM in MB (the driver does not report the window; ~192 MB is free on the
; test system, beyond that it silently uses system memory - detected by CPU write speed and logged).
; "smoke.exe probe" needs this set high (e.g. 1024).
VidmemCapMB=192
; Used only if the driver reports the free window size: always leave this much free.
VidmemReserveMB=32
; Stage 2d ("hybrid", experimental): UPLOAD heaps that stage 2c did not put into CPU-visible VRAM
; (all of them with VidmemHeaps=0, the overflow with VidmemHeaps=1) stay in system memory and get a
; DEFAULT-heap mirror in VRAM; vertex/index buffer views are redirected into it and the bytes they use
; are copied at each ExecuteCommandLists. Same GPU check as stage 2c (NVIDIA without ReBAR).
HybridHeaps=0
; Stage 2d: also redirect buffer SRVs (CreateShaderResourceView) into the mirror. A new SRV's range is
; copied at the next HybridSrvCopies submissions; data the game rewrites in place later is NOT refreshed.
HybridSrv=0
HybridSrvCopies=2
; Stage 2d: copy ranges closer than this many KB are merged into one copy (copies the gap too).
HybridMergeKB=16
; Stage 2d: run the copies on our own COPY queue (overlapping the game's earlier GPU work); the game's
; submission waits for them. 0 = copies at the front of the game's submission.
HybridCopyQueue=0
; Stage 2d diagnostic (Measure=1 only): hash mirrored buffers at each copy and at later submissions;
; count/log buffers that changed after their last copy without a new reference, and repair them.
HybridCheck=0
; Stage 2d negative test: redirect but never copy (rendering must break; smoke.exe must FAIL).
HybridTestNoCopy=0
; Stage 2a (no gain, keep off; Measure=1 only): DEFAULT-heap twins for the 4 MB UPLOAD constant pages.
ConstPages=0
; Stage 2a: bytes assumed readable after each root CBV address (the real CB size is unknown). Multiple of 256.
CbvPad=65536
