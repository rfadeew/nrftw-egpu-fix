; NRFTW eGPU Fix - settings. Lives next to version.dll in the game folder.
; Every key is optional: a missing key (or a missing file) means the default shown here.

[General]
; 0 = normal play (default).
; 1 = detailed measurement for bug reports: GPU timing and buffer statistics in
;     egpu_proxy.log. Costs some FPS; set it back to 0 afterwards.
Measure=0

[Stats]
; Seconds between the stats lines (FPS, CPU time per thread) in egpu_proxy.log.
IntervalSec=5

[Fix]
; The fix switches itself off on non-NVIDIA GPUs and on GPUs with Resizable BAR.
; 1 = main fix (default): the game's upload heaps live in VRAM; the CPU writes to a copy in
;     system memory and only the changed pages are copied to VRAM before the GPU uses them.
; 0 = off.
ShadowHeaps=1
; 1 = fallback (default): upload heaps the main fix could not take go into the GPU's
;     CPU-visible VRAM window (the v0.1.0 fix). With ShadowHeaps=0 this is the only fix.
; 0 = off. Both 0: the DLL only logs FPS.
VidmemHeaps=1
; Upper limit in MB for the fix's use of the CPU-visible VRAM window (BAR1, 256 MB without
; ReBAR). The fix also stops by itself when the window is full ("SYSMEM" line in the log);
; further heaps then stay in normal system memory, as without the fix. No action needed.
VidmemCapMB=192
